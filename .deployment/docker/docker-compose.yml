version: "3.8"

networks:
  example-net:
    name: example-net
    driver: bridge

services:
  php-cli:
    container_name: php-cli
    networks:
      - example-net
    build:
      context: ../../
      dockerfile: ./.deployment/docker/php-cli/Dockerfile
      args:
        PUID: ${PUID}
        PGID: ${PGID}
        INSTALL_XDEBUG: ${INSTALL_XDEBUG}
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ./../../:/var/www/symfony-blank

  php-fpm:
    container_name: php-fpm
    networks:
      - example-net
    build:
      context: ../../
      dockerfile: ./.deployment/docker/php-fpm/Dockerfile
      args:
        PUID: ${PUID}
        PGID: ${PGID}
        INSTALL_XDEBUG: ${INSTALL_XDEBUG}
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ./../../:/var/www/symfony-blank

  symfony-blank-worker:
    container_name: symfony-blank-worker
    networks:
      - symfony-blank
    build:
      context: ../../
      dockerfile: ./.deployment/docker/php-worker/Dockerfile
      args:
        PUID: ${PUID}
        PGID: ${PGID}
        INSTALL_XDEBUG: ${INSTALL_XDEBUG}
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    depends_on:
      - rabbitmq
    volumes:
      - ./../../:/var/www/symfony-blank
      - ./supervisor/conf.d:/etc/supervisor/conf.d

  nginx:
    container_name: nginx
    networks:
      - example-net
    build:
      context: ./nginx
      dockerfile: ./Dockerfile
      args:
        PHP_UPSTREAM_CONTAINER: ${PHP_UPSTREAM_CONTAINER}
        PHP_UPSTREAM_PORT: ${PHP_UPSTREAM_PORT}
    environment:
      PHP_UPSTREAM_CONTAINER: ${PHP_UPSTREAM_CONTAINER}
      PHP_UPSTREAM_PORT: ${PHP_UPSTREAM_CONTAINER}
    ports:
      - ${NGINX_HOST_HTTP_PORT}:80
    volumes:
      - ./../../:/var/www/symfony-blank:rw
    depends_on:
      - php-fpm

  postgres:
    container_name: postgres
    networks:
      - example-net
    build:
      context: ./postgres
      dockerfile: ./Dockerfile
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      POSTGRES_HOST: ${POSTGRES_DB_HOST}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_example_data:/var/lib/postgresql/data:rw

  rabbitmq:
    container_name: rabbitmq
    build:
      context: ../../
      dockerfile: ./.deployment/docker/rabbitmq/Dockerfile
    ports:
      - ${RABBIT_PORT}:5672
      - ${RABBIT_MANAGEMENT_PORT}:15672
      - ${RABBIT_STREAM_PORT}:5552
      - ${RABBIT_MQTT_PORT}:1883
      - ${RABBIT_MQTT_WS_PORT}:15675
    networks:
      - symfony-blank
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
        -rabbitmq_stream advertised_host localhost
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq

volumes:
  db_example_data:
  rabbitmq-data:
    driver: local
  rabbitmq-logs:
    driver: local
